<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>المتجر | اختيار الواجهة</title>
  <link id="siteFavicon" rel="icon" type="image/png" />
  <link rel="apple-touch-icon" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800;900&display=swap" rel="stylesheet">
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
  <script src="firebase-config.js"></script>
  <style>
    :root{
      --primary:#14454d;
      --accent:#f37021;
      --ink:#071018;
      --muted:#d7e0e7;
      --glass:rgba(255,255,255,.12);
      --line:rgba(255,255,255,.18);
    }
    *{box-sizing:border-box}
    html,body{height:100%}
    body{
      margin:0;
      font-family:'Cairo',system-ui,sans-serif;
      color:#fff;
      background:#071018;
      overflow:hidden;
      -webkit-tap-highlight-color:transparent;
    }
    .page{
      min-height:100%;
      position:relative;
      display:flex;
      align-items:stretch;
      justify-content:center;
      padding:0;
      isolation:isolate;
    }
    .bg{
      position:absolute;
      inset:0;
      z-index:-3;
      background:#071018 center/cover no-repeat;
      filter:saturate(1.04) contrast(1.04);
      transition:background-image .35s ease, opacity .35s ease;
    }
    .shade{
      position:absolute;
      inset:0;
      z-index:-2;
      background:
        radial-gradient(circle at 18% 18%, rgba(243,112,33,.34), transparent 28%),
        radial-gradient(circle at 86% 8%, rgba(20,69,77,.62), transparent 34%),
        linear-gradient(180deg, rgba(7,16,24,.48), rgba(7,16,24,.92));
    }
    .orb{
      position:absolute;
      width:280px;
      height:280px;
      border-radius:999px;
      background:rgba(243,112,33,.20);
      filter:blur(34px);
      right:-90px;
      bottom:-80px;
      z-index:-1;
      animation:float 7s ease-in-out infinite alternate;
    }
    @keyframes float{to{transform:translate(-26px,-22px) scale(1.06)}}
    .shell{
      width:100%;
      min-height:100vh;
      display:flex;
      flex-direction:column;
      justify-content:space-between;
      gap:24px;
      padding:24px;
      border:none;
      border-radius:0;
      background:linear-gradient(180deg,rgba(7,16,24,.10),rgba(7,16,24,.70));
      box-shadow:none;
      backdrop-filter:none;
      overflow:hidden;
      position:relative;
    }
    .shell::before{
      content:"";
      position:absolute;
      inset:0;
      background:linear-gradient(130deg,rgba(255,255,255,.10),transparent 30%,transparent 72%,rgba(255,255,255,.06));
      pointer-events:none;
    }
    .top{
      position:relative;
      z-index:1;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:14px;
    }
    .brand{display:flex;align-items:center;gap:12px;min-width:0;transition:opacity .18s ease}
    .brand[data-ready="0"]{opacity:0}
    .logo{
      width:58px;
      height:58px;
      border-radius:18px;
      background:rgba(255,255,255,.14);
      border:1px solid rgba(255,255,255,.25);
      display:grid;
      place-items:center;
      overflow:hidden;
      box-shadow:0 16px 36px rgba(0,0,0,.22);
    }
    .logo img{width:100%;height:100%;object-fit:contain;display:none;padding:6px;background:#fff}
    .logo span{display:none;font-size:13px;font-weight:900;color:#fff;max-width:160px;padding:0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .logo.text-fallback{width:auto;min-width:58px;max-width:170px;padding-inline:8px}
    .logo.text-fallback span{display:block}
    .brand-text{min-width:0}
    .brand-name{font-weight:900;font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
    .brand-sub{font-size:11px;color:rgba(255,255,255,.70);font-weight:800;letter-spacing:.12em;text-transform:uppercase}
    .chip{
      border:1px solid rgba(255,255,255,.22);
      background:rgba(255,255,255,.10);
      color:#fff;
      border-radius:999px;
      padding:9px 12px;
      font-size:12px;
      font-weight:900;
      white-space:nowrap;
    }
    .hero{
      position:relative;
      z-index:1;
      padding:48px 4px 10px;
      width:min(100%,720px);
    }
    .kicker{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding:9px 13px;
      border-radius:999px;
      background:rgba(243,112,33,.18);
      color:#ffd9c5;
      border:1px solid rgba(243,112,33,.30);
      font-size:13px;
      font-weight:900;
      margin-bottom:18px;
    }
    h1{
      margin:0;
      font-size:clamp(34px,9vw,54px);
      line-height:1.18;
      letter-spacing:-1.6px;
      font-weight:900;
      text-shadow:0 16px 34px rgba(0,0,0,.35);
    }
    .lead{
      margin:18px 0 0;
      color:rgba(255,255,255,.78);
      font-size:16px;
      line-height:1.9;
      font-weight:800;
      max-width:440px;
    }
    .actions{
      position:relative;
      z-index:1;
      display:grid;
      grid-template-columns:repeat(2,minmax(0,1fr));
      gap:14px;
      width:min(100%,620px);
      margin:0 auto 6px;
      padding:0;
      border:0;
    }
    .choice{
      width:100%;
      min-height:82px;
      border-radius:26px;
      padding:16px 18px;
      cursor:pointer;
      display:flex;
      align-items:center;
      justify-content:flex-start;
      gap:13px;
      font-family:inherit;
      transition:.18s ease;
      text-align:right;
      box-shadow:0 18px 38px rgba(0,0,0,.20);
      border:1px solid rgba(255,255,255,.18);
    }
    .choice:hover{transform:translateY(-2px);box-shadow:0 22px 48px rgba(0,0,0,.26)}
    .choice:active{transform:scale(.985)}
    .choice .label{display:block;font-size:20px;font-weight:900;line-height:1.2}
    .choice .sub{display:block;font-size:12px;font-weight:800;opacity:.72;margin-top:6px}
    .choice-icon{
      width:48px;
      height:48px;
      border-radius:18px;
      display:grid;
      place-items:center;
      flex:0 0 auto;
    }
    .choice-icon svg{width:25px;height:25px}
    .sports{background:rgba(255,255,255,.96);color:#071018}
    .sports .choice-icon{background:#071018;color:#fff}
    .casual{background:linear-gradient(135deg,rgba(20,69,77,.96),rgba(11,34,42,.96));color:#fff}
    .casual .choice-icon{background:rgba(255,255,255,.14);color:#fff}
    .foot{
      position:relative;
      z-index:1;
      color:rgba(255,255,255,.54);
      font-size:11px;
      font-weight:800;
      text-align:center;
      padding-top:4px;
    }
    @media (max-width:430px){
      .page{padding:0}
      .shell{min-height:100vh;border-radius:0;padding:18px}
      .hero{padding-top:38px}
      .actions{grid-template-columns:1fr;width:min(100%,420px);margin-bottom:6px}
      .choice{border-radius:24px;min-height:78px;padding-inline:16px}
    }
  </style>

  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#14454d">
  <meta name="application-name" content="المتجر">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="المتجر">
  <link rel="icon" href="app-icon-192.png" sizes="192x192" type="image/png">
  <link rel="apple-touch-icon" href="app-icon-192.png">
  <script defer src="pwa-register.js"></script>
</head>
<body>
  <main class="page">
    <div class="bg" id="heroBg"></div>
    <div class="shade"></div>
    <div class="orb"></div>

    <section class="shell" aria-label="اختيار واجهة المتجر">
      <div class="top">
        <div class="brand" id="brandBlock" data-ready="0">
          <div class="logo" id="logoBox" aria-hidden="true"><img id="logoImg" alt=""><span id="logoFallback"></span></div>
          <div class="brand-text">
            <div class="brand-name" id="storeName"></div>
            <div class="brand-sub">STORE</div>
          </div>
        </div>
        <div class="chip">واجهة المتجر</div>
      </div>

      <div class="hero">
        <div class="kicker" id="homeKicker">مجموعة الموسم الجديد</div>
        <h1 id="homeTitle">أناقة بلا حدود.<br>راحة بلا تنازلات.</h1>
        <p class="lead" id="homeSubtitle">اختر القسم المناسب للدخول إلى تجربة تسوق مرتبة وسريعة.</p>
      </div>

      <div class="actions">
        <button class="choice sports" type="button" onclick="openStore('sports')" aria-label="دخول قسم الملابس الرياضية">
          <span class="choice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M13 2 5 13h6l-1 9 9-13h-6l1-7z"/></svg>
          </span>
          <span><span class="label">ملابس رياضية</span><span class="sub">تصاميم عملية، مريحة، وجاهزة للحركة</span></span>
        </button>
        <button class="choice casual" type="button" onclick="openStore('casual')" aria-label="دخول قسم الملابس الكاجوال">
          <span class="choice-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor"><path stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round" d="M4 7.5 9 4l6 3.5 5-1.5v11l-5 3-6-3-5 1.5v-11zM9 4v13M15 7.5V20"/></svg>
          </span>
          <span><span class="label">ملابس كاجوال</span><span class="sub">ستايل يومي أنيق بتجربة شراء احترافية</span></span>
        </button>
      </div>

      <div class="foot">اختر الواجهة المناسبة للانتقال إلى المتجر</div>
    </section>
  </main>

  <script>
    const fallbackLogo = "";

    function normalizeImageUrl(url){
      const raw = String(url || "").trim();
      if(!raw) return "";
      if(raw.startsWith("gs://")){
        const without = raw.replace(/^gs:\/\//, "");
        const slashIndex = without.indexOf("/");
        if(slashIndex > -1){
          const bucket = without.slice(0, slashIndex);
          const path = without.slice(slashIndex + 1);
          return `https://firebasestorage.googleapis.com/v0/b/${encodeURIComponent(bucket)}/o/${encodeURIComponent(path)}?alt=media`;
        }
        return "";
      }
      return raw;
    }

    function logoFallbackText(text){
      return String(text || "المتجر").trim() || "المتجر";
    }

    function markBrandReady(){
      const brand = document.getElementById("brandBlock");
      if(brand) brand.dataset.ready = "1";
    }

    function validSection(section){
      return section === "sports" || section === "casual";
    }

    function openStore(section){
      const selected = validSection(section) ? section : "sports";
      window.location.href = `store.html?section=${encodeURIComponent(selected)}`;
    }

    function setText(id, value){
      const el = document.getElementById(id);
      if(el && value) el.textContent = value;
    }

    function setTitle(value){
      const el = document.getElementById("homeTitle");
      if(el && value) el.innerHTML = String(value).replace(/\n/g,"<br>");
    }

    function firstValue(...values){
      for(const value of values){
        const cleanValue = String(value || "").trim();
        if(cleanValue) return cleanValue;
      }
      return "";
    }

    function getSectionSettings(store, sectionId){
      const groups = store?.sectionSettings || store?.sectionsSettings || store?.homeSections || {};
      return groups?.[sectionId] || {};
    }

    function prepareImageUrlForCss(url){
      return normalizeImageUrl(url).replace(/\\/g, "\\\\").replace(/"/g, '\\"');
    }

    function setLogo(url, storeName = "المتجر"){
      const box = document.getElementById("logoBox");
      const img = document.getElementById("logoImg");
      const fallback = document.getElementById("logoFallback");
      const safeUrl = normalizeImageUrl(url);
      if(fallback) fallback.textContent = logoFallbackText(storeName || "المتجر");
      if(!img) { markBrandReady(); return; }

      const showFallback = () => {
        img.onload = null;
        img.onerror = null;
        img.style.display = "none";
        img.removeAttribute("src");
        if(box) box.classList.add("text-fallback");
        if(fallback) fallback.style.display = "block";
        markBrandReady();
      };

      if(!safeUrl){
        showFallback();
        return;
      }

      if(box) box.classList.remove("text-fallback");
      img.onload = () => {
        if(!img.naturalWidth){
          showFallback();
          return;
        }
        img.style.display = "block";
        if(fallback) fallback.style.display = "none";
        markBrandReady();
      };
      img.onerror = showFallback;
      img.decoding = "async";
      img.loading = "eager";
      img.referrerPolicy = "no-referrer";
      img.src = safeUrl;

      const fav = document.getElementById("siteFavicon");
      if(fav) fav.href = safeUrl;
    }

    function setHeroBackground(url){
      const bg = document.getElementById("heroBg");
      const safeUrl = normalizeImageUrl(url);
      if(!bg) return;
      if(!safeUrl){
        bg.style.backgroundImage = "";
        return;
      }
      const probe = new Image();
      probe.onload = () => {
        if(probe.naturalWidth){
          bg.style.backgroundImage = `url("${prepareImageUrlForCss(safeUrl)}")`;
        }
      };
      probe.onerror = () => { bg.style.backgroundImage = ""; };
      probe.decoding = "async";
      probe.referrerPolicy = "no-referrer";
      probe.src = safeUrl;
    }

    let landingHydratedOnce = false;

    function applyLandingSettings(store = {}, banners = {}){
      const sportsSettings = getSectionSettings(store, "sports");
      const casualSettings = getSectionSettings(store, "casual");
      const storeDisplayName = firstValue(store.storeNameAr, store.storeName, store.nameAr, store.name, store.storeNameEn, "المتجر");
      const logo = firstValue(
        store.storeLogoUrl,
        store.logoUrl,
        store.logoURL,
        store.logo,
        store.storeLogo,
        store.storeLogoURL,
        store.storeLogoImageUrl,
        store.logoImageUrl,
        store.logoImage,
        store.logoImageURL,
        store.storeIcon,
        store.icon,
        store.favicon,
        banners.logoUrl,
        banners.storeLogoUrl,
        fallbackLogo
      );
      const hero = firstValue(
        store.homeHeroImageUrl,
        store.homeHeroUrl,
        store.homeBackgroundImageUrl,
        store.homeBackgroundUrl,
        store.backgroundImageUrl,
        store.sectionsBackgroundUrl,
        store.sectionsBgUrl,
        store.heroImageUrl,
        store.heroUrl,
        sportsSettings.homeHeroImageUrl,
        sportsSettings.homeBackgroundImageUrl,
        casualSettings.homeHeroImageUrl,
        casualSettings.homeBackgroundImageUrl,
        banners.homeHeroImageUrl,
        banners.homeBackgroundImageUrl,
        banners.sectionsBackgroundUrl,
        banners.topBannerUrl
      );

      setText("storeName", storeDisplayName);
      setText("homeKicker", store.homeKickerAr || store.homeKicker || "مجموعة الموسم الجديد");
      setTitle(store.homeTitleAr || store.homeTitle || "أناقة بلا حدود.\nراحة بلا تنازلات.");
      setText("homeSubtitle", store.homeSubtitleAr || store.homeSubtitle || "اختر القسم المناسب للدخول إلى تجربة تسوق مرتبة وسريعة.");
      setLogo(logo, storeDisplayName);
      setHeroBackground(hero);
      landingHydratedOnce = true;
    }

    async function hydrateLanding(){
      try{
        if(!window.firebase || typeof firebaseConfig5546 === "undefined"){
          applyLandingSettings({}, {});
          return;
        }
        if(!firebase.apps.length) firebase.initializeApp(firebaseConfig5546);
        const db = firebase.database();
        const storeRef = db.ref(FIREBASE_PATHS_5546.settingsStore);
        const bannersRef = db.ref(FIREBASE_PATHS_5546.settingsBanners);
        const [storeSnap, bannersSnap] = await Promise.all([storeRef.get(), bannersRef.get()]);
        applyLandingSettings(storeSnap.val() || {}, bannersSnap.val() || {});

        storeRef.on("value", async snap => {
          const bannersSnap = await bannersRef.get();
          applyLandingSettings(snap.val() || {}, bannersSnap.val() || {});
        });
        bannersRef.on("value", async snap => {
          const storeSnap = await storeRef.get();
          applyLandingSettings(storeSnap.val() || {}, snap.val() || {});
        });
      }catch(e){
        if(!landingHydratedOnce) setLogo(fallbackLogo, "المتجر");
      }
    }
    hydrateLanding();
  </script>
</body>
</html>
